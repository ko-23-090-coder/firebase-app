<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Облачное приложение</title>

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f4f7f6;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

.auth-bar {
  display: flex;
  align-items: center;
  gap: 15px;
}

.user-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
}

button {
  background: #007bff;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 5px;
  width: 100%;
  cursor: pointer;
}

.post {
  background: #fff;
  border: 1px solid #eaeaea;
  padding: 15px;
  margin-top: 15px;
  border-radius: 8px;
}

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
}

.like-btn {
  margin-top: 10px;
}
</style>
</head>

<body>

<div id="authSection" class="container">
  <button id="loginBtn">Войти через Google</button>

  <div id="userInfo" style="display:none;" class="auth-bar">
    <img id="userPhoto" class="user-avatar">
    <span id="userName"></span>
    <button id="logoutBtn">Выйти</button>
  </div>
</div>

<div id="messageForm" class="container" style="display:none;">
  <h3>Создать запись</h3>

  <input type="text" id="content" placeholder="Что у вас нового?">

  <!-- ВОТ СЮДА добавляем -->
  <input type="file" id="imageInput" accept="image/*">

  <button id="mainBtn">Опубликовать</button>
</div>

  <div id="testSection" class="container">
  <button id="testBtn">Попробовать создать запись без авторизации</button>
</div>

<div id="feed" style="width:100%; max-width:500px;"></div>

<script type="module">
  import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  updateDoc,
  doc,
  increment,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// 1️⃣ Инициализация Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCmbP3zEtq3T0gVJtkCTt3Zmd2uKS5ONrY",
  authDomain: "start-d5cf0.firebaseapp.com",
  projectId: "start-d5cf0",
  storageBucket: "start-d5cf0.firebasestorage.app",
  messagingSenderId: "523693191910",
  appId: "1:523693191910:web:8218a1fcb672434c020127",
  measurementId: "G-WTB85B4NZG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app); // ← теперь правильно
const provider = new GoogleAuthProvider();

// 2️⃣ DOM элементы
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userInfo = document.getElementById("userInfo");
const messageForm = document.getElementById("messageForm");
const userName = document.getElementById("userName");
const userPhoto = document.getElementById("userPhoto");
const mainBtn = document.getElementById("mainBtn");
const feed = document.getElementById("feed");
const testBtn = document.getElementById("testBtn");

// 3️⃣ Кнопка входа/выход
loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginBtn.style.display = 'none';
    userInfo.style.display = 'flex';
    messageForm.style.display = 'block';
    userName.innerText = user.displayName;
    userPhoto.src = user.photoURL;
  } else {
    loginBtn.style.display = 'block';
    userInfo.style.display = 'none';
    messageForm.style.display = 'none';
  }
});

// 4️⃣ Создание поста авторизованным пользователем
mainBtn.onclick = async () => {
  const content = document.getElementById('content').value;
  const file = document.getElementById('imageInput').files[0];

  if (!content && !file) return;

  let imageUrl = null;

  // Если выбрана картинка — загружаем её
  if (file) {
    const imageRef = ref(storage, "images/" + Date.now() + "_" + file.name);
    await uploadBytes(imageRef, file);
    imageUrl = await getDownloadURL(imageRef);
  }

  await addDoc(collection(db, "requests"), {
    name: auth.currentUser.displayName,
    photo: auth.currentUser.photoURL,
    text: content,
    image: imageUrl || null,
    likes: 0,
    timestamp: serverTimestamp()
  });

  document.getElementById('content').value = "";
  document.getElementById('imageInput').value = "";
};

// 5️⃣ Попытка создать запись без авторизации
testBtn.onclick = async () => {
  try {
    await addDoc(collection(db, "requests"), {
      name: "Test",
      text: "Проверка безопасности",
      likes: 0,
      timestamp: serverTimestamp()
    });
    alert("Запись создана!");
  } catch(e) {
    alert("Ошибка: " + e.message);
  }
};

// 6️⃣ Лайки, редактирование, удаление
window.processLike = async (id) => {
  await updateDoc(doc(db, "requests", id), { likes: increment(1) });
};

window.editPost = async (id, currentText) => {
  const newText = prompt("Введите новый текст:", currentText);
  if (!newText) return;
  await updateDoc(doc(db, "requests", id), { text: newText });
};

window.deletePost = async (id) => {
  if (!confirm("Удалить запись?")) return;
  await deleteDoc(doc(db, "requests", id));
};

// 7️⃣ Загрузка постов
const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
onSnapshot(q, (snapshot) => {
  feed.innerHTML = "";
  snapshot.forEach((docItem) => {
    const data = docItem.data();
    feed.innerHTML += `
      <div class="post">
        <div class="post-header">
          <img src="${data.photo || ''}" class="post-avatar">
          <b>${data.name}</b>
        </div>
        <p>${data.text}</p>
        ${data.image ? `<img src="${data.image}" style="width:100%; margin-top:10px; border-radius:8px;">` : ""}
        <button class="like-btn" onclick="processLike('${docItem.id}')">
          👍 ${data.likes || 0}
        </button>
        <button onclick="editPost('${docItem.id}', \`${data.text}\`)">
          Редактировать
        </button>
        <button onclick="deletePost('${docItem.id}')">
          Удалить
        </button>
      </div>
    `;
  });
});
</script>
