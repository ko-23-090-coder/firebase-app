<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Облачное приложение</title>

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f4f7f6;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

.auth-bar {
  display: flex;
  align-items: center;
  gap: 15px;
}

.user-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
}

button {
  background: #007bff;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 5px;
  width: 100%;
  cursor: pointer;
}

.post {
  background: #fff;
  border: 1px solid #eaeaea;
  padding: 15px;
  margin-top: 15px;
  border-radius: 8px;
}

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
}

.like-btn {
  margin-top: 10px;
}

/* ── DM стили ── */
#chatBox {
  margin-top: 15px;
  max-height: 320px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border: 1px solid #eee;
  border-radius: 8px;
  background: #fafafa;
}

.chat-bubble {
  max-width: 75%;
  padding: 8px 12px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.4;
  word-break: break-word;
}

.chat-bubble.me {
  background: #007bff;
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.chat-bubble.other {
  background: #e9ecef;
  color: #333;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.dm-input-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  align-items: center;
}

.dm-input-row input {
  flex: 1;
  margin: 0;
}

.dm-input-row button {
  width: auto;
  padding: 12px 18px;
  white-space: nowrap;
}

#dmStatus {
  font-size: 12px;
  color: #999;
  margin-top: 6px;
  min-height: 16px;
}
</style>
</head>

<body>

<div id="authSection" class="container">
  <button id="loginBtn">Войти через Google</button>

  <div id="userInfo" style="display:none;" class="auth-bar">
    <img id="userPhoto" class="user-avatar">
    <span id="userName"></span>
    <button id="logoutBtn">Выйти</button>
  </div>
</div>

<div id="messageForm" class="container" style="display:none;">
  <h3>Создать запись</h3>
  <input type="text" id="content" placeholder="Что у вас нового?">
  <input type="file" id="imageInput" accept="image/*">
  <button id="mainBtn">Опубликовать</button>
</div>

<div id="testSection" class="container">
  <button id="testBtn">Попробовать создать запись без авторизации</button>
</div>

<div id="feed" style="width:100%; max-width:500px;"></div>

<div id="dmSection" class="container" style="display:none;">
  <h3>💬 Личные сообщения</h3>

  <select id="userSelect">
    <option value="">Выберите собеседника</option>
  </select>

  <div id="chatBox"></div>
  <div id="dmStatus"></div>

  <div class="dm-input-row">
    <input type="text" id="dmInput" placeholder="Ваше сообщение...">
    <button id="sendDmBtn">Отправить</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  updateDoc,
  doc,
  increment,
  deleteDoc,
  getDocs,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// ── Firebase config ──
const firebaseConfig = {
  apiKey: "AIzaSyCmbP3zEtq3T0gVJtkCTt3Zmd2uKS5ONrY",
  authDomain: "start-d5cf0.firebaseapp.com",
  projectId: "start-d5cf0",
  storageBucket: "start-d5cf0.firebasestorage.app",
  messagingSenderId: "523693191910",
  appId: "1:523693191910:web:8218a1fcb672434c020127",
  measurementId: "G-WTB85B4NZG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// ── DOM ──
const loginBtn    = document.getElementById("loginBtn");
const logoutBtn   = document.getElementById("logoutBtn");
const userInfo    = document.getElementById("userInfo");
const messageForm = document.getElementById("messageForm");
const userName    = document.getElementById("userName");
const userPhoto   = document.getElementById("userPhoto");
const mainBtn     = document.getElementById("mainBtn");
const feed        = document.getElementById("feed");
const testBtn     = document.getElementById("testBtn");
const dmSection   = document.getElementById("dmSection");
const dmStatus    = document.getElementById("dmStatus");

loginBtn.onclick = () => signInWithPopup(auth, provider).catch(e => alert(e.message));
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    loginBtn.style.display = 'none';
    userInfo.style.display = 'flex';
    messageForm.style.display = 'block';
    dmSection.style.display = 'block';
    userName.innerText = user.displayName;
    userPhoto.src = user.photoURL;
    loadUsers();
  } else {
    loginBtn.style.display = 'block';
    userInfo.style.display = 'none';
    messageForm.style.display = 'none';
    dmSection.style.display = 'none';
  }
});

// ── Публикация поста ──
mainBtn.onclick = async () => {
  const content = document.getElementById('content').value;
  const file = document.getElementById('imageInput').files[0];
  let imageBase64 = null;

  if (file) {
    if (file.size > 700000) {
      alert("Файл слишком большой! Максимум 700KB");
      return;
    }
    imageBase64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = (err) => reject(err);
      reader.readAsDataURL(file);
    });
  }

  await addDoc(collection(db, "requests"), {
    uid: auth.currentUser.uid,
    name: auth.currentUser.displayName,
    photo: auth.currentUser.photoURL,
    text: content,
    image: imageBase64 || null,
    likes: 0,
    timestamp: serverTimestamp()
  });

  document.getElementById('content').value = "";
  document.getElementById('imageInput').value = "";
};

// ── Тест без авторизации ──
testBtn.onclick = async () => {
  try {
    await addDoc(collection(db, "requests"), {
      name: "Test",
      text: "Проверка безопасности",
      likes: 0,
      timestamp: serverTimestamp()
    });
    alert("Запись создана!");
  } catch(e) {
    alert("Ошибка: " + e.message);
  }
};

// ── Лайк / редактировать / удалить (глобальные для onclick в innerHTML) ──
window.processLike = async (id) => {
  await updateDoc(doc(db, "requests", id), { likes: increment(1) });
};

window.editPost = async (id, currentText) => {
  const newText = prompt("Введите новый текст:", currentText);
  if (!newText) return;
  await updateDoc(doc(db, "requests", id), { text: newText });
};

window.deletePost = async (id) => {
  if (!confirm("Удалить запись?")) return;
  await deleteDoc(doc(db, "requests", id));
};

// ── Лента ──
const feedQuery = query(collection(db, "requests"), orderBy("timestamp", "desc"));
onSnapshot(feedQuery, (snapshot) => {
  feed.innerHTML = "";
  snapshot.forEach((docItem) => {
    const data = docItem.data();
    feed.innerHTML += `
      <div class="post">
        <div class="post-header">
          <img src="${data.photo || ''}" class="post-avatar">
          <b>${data.name}</b>
        </div>
        <p>${data.text}</p>
        ${data.image ? `<img src="${data.image}" style="width:100%; margin-top:10px; border-radius:8px;">` : ""}
        <button class="like-btn" onclick="processLike('${docItem.id}')">
          👍 ${data.likes || 0}
        </button>
        <button onclick="editPost('${docItem.id}', \`${data.text}\`)">
          Редактировать
        </button>
        <button onclick="deletePost('${docItem.id}')">
          Удалить
        </button>
      </div>
    `;
  });
});

// ── DM: загрузка списка пользователей ──
async function loadUsers() {
  const snapshot = await getDocs(collection(db, "requests"));
  const userSelect = document.getElementById("userSelect");
  const users = new Map();

  snapshot.forEach(docItem => {
    const data = docItem.data();
    if (data.uid && data.uid !== auth.currentUser.uid) {
      users.set(data.uid, data.name);
    }
  });

  userSelect.innerHTML = '<option value="">Выберите собеседника</option>';
  users.forEach((name, uid) => {
    userSelect.innerHTML += `<option value="${uid}">${name}</option>`;
  });
}

// ── DM: создать или открыть чат ──
async function getChatId(uid1, uid2) {
  const chatId = uid1 < uid2 ? uid1 + "_" + uid2 : uid2 + "_" + uid1;
  await setDoc(doc(db, "chats", chatId), {
    participants: [uid1, uid2]
  }, { merge: true });
  return chatId;
}

// ── DM: состояние текущего чата ──
let currentChatId = null;
let unsubscribeChat = null;

// ── DM: смена собеседника ──
document.getElementById("userSelect").onchange = async (e) => {
  const selectedUid = e.target.value;
  const chatBox = document.getElementById("chatBox");
  chatBox.innerHTML = "";
  dmStatus.textContent = "";

  // Отписываемся от предыдущего чата — это было главной причиной глюков
  if (unsubscribeChat) {
    unsubscribeChat();
    unsubscribeChat = null;
  }
  currentChatId = null;

  if (!selectedUid) return;

  dmStatus.textContent = "Загрузка...";

  try {
    const chatId = await getChatId(auth.currentUser.uid, selectedUid);
    currentChatId = chatId; // сохраняем для кнопки отправки

    const messagesQuery = query(
      collection(db, "chats", chatId, "messages"),
      orderBy("timestamp")
    );

    unsubscribeChat = onSnapshot(messagesQuery, (snapshot) => {
      chatBox.innerHTML = "";

      if (snapshot.empty) {
        chatBox.innerHTML = '<p style="color:#aaa;text-align:center;font-size:13px;padding:10px;">Сообщений пока нет</p>';
        return;
      }

      snapshot.forEach(docItem => {
        const data = docItem.data();
        const isMe = data.senderId === auth.currentUser.uid;

        const bubble = document.createElement("div");
        bubble.className = "chat-bubble " + (isMe ? "me" : "other");
        bubble.textContent = data.text;
        chatBox.appendChild(bubble);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    });

    dmStatus.textContent = "✓ Чат открыт";
    setTimeout(() => { dmStatus.textContent = ""; }, 1500);

  } catch(e) {
    dmStatus.textContent = "Ошибка: " + e.message;
  }
};

// ── DM: отправка сообщения ──
async function sendDM() {
  const selectedUid = document.getElementById("userSelect").value;
  const input = document.getElementById("dmInput");
  const text = input.value.trim();

  if (!selectedUid) { alert("Выберите собеседника"); return; }
  if (!text) return;

  // Берём уже открытый chatId — не делаем лишний запрос к Firestore
  const chatId = currentChatId;
  if (!chatId) { alert("Подождите, чат ещё открывается..."); return; }

  try {
    await addDoc(collection(db, "chats", chatId, "messages"), {
      senderId: auth.currentUser.uid,
      text: text,
      timestamp: serverTimestamp()
    });
    input.value = "";
  } catch(e) {
    alert("Ошибка отправки: " + e.message);
  }
}

document.getElementById("sendDmBtn").onclick = sendDM;

// Enter для отправки
document.getElementById("dmInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendDM();
});
</script>
</body>
</html>
